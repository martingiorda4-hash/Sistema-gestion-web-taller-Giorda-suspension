<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/trabajos.css">
    <title>Trabajos</title>
</head>
<body>
    <div id="sidebar"></div>

    <main>
        <div class="titulo">

            <h1>Trabajos</h1>
            <button class="btn-trabajos" id="btnNuevoTrabajo">+ Nuevo trabajo</button>
        </div>
        <div class="filtros">

            <div class="buscador">
                <input type="text" id="inputBuscarTrabajos" placeholder="Buscar trabajos por cliente, vehículo, estado o fecha...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <select id="estado">
                <option value="todos">Estado: Todos</option>
                <option value="En progreso">Estado: En progreso</option>
                <option value="Terminado">Estado: Terminado</option>
                <option value="Entregado">Estado: Entregado</option>
            </select>

            <div class="filtro-fecha">
                <div class="campo-fecha">
                    <span>Desde</span>
                    <input type="date" id="fechaDesde">
                </div>

                <div class="campo-fecha">
                    <span>Hasta</span>
                    <input type="date" id="fechaHasta">
                </div>
            </div>
        </div>

        <section class="tabla-trabajos">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Vehículo</th>
                        <th>Estado</th>
                    </tr>
                </thead>

                <tbody id="tablaTrabajos">
                </tbody>
            </table>
            <div class="paginacion">
                <p id="infoPagina"></p>
                <div class="botones-paginacion">
                    <button id="btnAnterior">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    
                    <button class="numero-pagina activo" data-pagina="1">1</button>
                    <button class="numero-pagina" data-pagina="2">2</button>
                    <button class="numero-pagina" data-pagina="3">3</button>
                    
                    <button id="btnSiguiente">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <div class="modal-trabajo oculto" id="modalTrabajo">
        <div class="modal">
            <button type="button" class="cerrar" id="btnCerrarModalNuevoTrabajo">X</button>
            <h2>Nuevo trabajo</h2>
            <form id="formTrabajo">
                <div class="columnas">
                    <div class="columna-derecha">

                        <input type="hidden" id="trabajoId">
                    
                        <label>Cliente</label>
                        <select id="cliente">
                            <option value="">Seleccione un cliente</option>
                        </select>
                        
                        <label>Vehículo</label>
                        <select id="vehiculoCliente">
                            <option value="">Seleccione un vehiculo respecto al cliente</option>
                        </select>
                    </div>

                    <div class="columna-izquierda">

                        
                        <label>Estado</label>
                        <select id="estadoModal">
                            <option value="">Seleccione un estado</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="En progreso">En progreso</option>
                            <option value="Terminado">Terminado</option>
                            <option value="Entregado">Entregado</option>
                        </select>
                        
                        <label>Servicio</label>
                        <select id="servicio">
                            <option value="">Seleccione un servicio</option>
                        </select>

                        <button type="button" id="btnAgregarServicio" class="btn-Agregar-Servicio">
                            +Agregar
                        </button>

                    </div>
                </div>
                    <div class="servicios-container">
                        <label>Servicios seleccionados</label>
                        <div id="serviciosSeleccionados" class="servicios-seleccionados"></div>
                    </div>

                    <div class="pago-containter">

                        <div id="pagoSeleccionado"></div>
                        <button type="button" id="registrarNuevoPago">
                            + Registrar pago
                        </button>

                    </div>

                    
                    <div class="observaciones-container">
                        <label>Observaciones</label>
                        <textarea id="observaciones" placeholder="Ingrese observaciones del trabajo..."></textarea>
                    </div>

                    
                    
                    <div class="modal-botones">
                        <button type="button" id="btnCancelarTrabajo">Cancelar</button>
                        <button type="submit" id="btnGuardarTrabajo">Guardar</button>
                    </div>
            </form>
        </div>
    </div>
    <div class="modal-trabajo oculto" id="modalNuevoPago">
        <div class="modal modal-nuevoPago">
            <button type="button" class="cerrar" id="btnCerrarModalPago">X</button>

            <h2>Registrar pago</h2>
            <label>Importe</label>
            <input type="number" id="importePago" placeholder="Ej: 25000" min="0" step="0.01">

            <label>Método de pago</label>
            <select id="metodoPago">
                <option value="">Seleccione un método de pago</option>
                <option value="Débito">Débito</option>
                <option value="Crédito">Crédito</option>
                <option value="Efectivo">Efectivo</option>
                <option value="QR">QR</option>
                <option value="Transferencia">Transferencia</option>
            </select>

            <div class="modal-botones">
                <button type="button" id="btnCancelarPago">Cancelar</button>
                <button type="button" id="btnGuardarPago">Guardar</button>
            </div>
        </div>
    </div> 
    <div class="modal-detalle-trabajo oculto" id="modalDetalleTrabajo">
        <div class="modal-detalle-contenido">
            <button type="button" class="cerrar-detalle" id="btnCerrarModalDetalle">X</button>
            <h2>Detalle del trabajo</h2>
            <div class="campos-detalle">
                <label>Cliente: </label>
                <p id="clienteDetalle"></p>
            </div>
            <div class="campos-detalle">
                <label>Vehiculo: </label>
                <p id="vehiculoDetalle"></p>
            </div>
            <div class="campos-detalle">
                <label>Fecha: </label>
                <p id="fechaDetalle"></p>
            </div>
            <div class="campos-detalle">
                <label>Estado: </label>
                <p id="estadoDetalle"></p>
            </div>
            <div class="campos-detalle">
                <label>Servicios: </label>
                <div class="lista-servicios-detalle" id="serviciosDetalle"></div>
            </div>  
            <div class="campos-detalle-observaciones">
                <label>Observaciones: </label>
                <p id="observacionesDetalle"></p>
            </div>
        </div>
    </div>
    <div class="modal-eliminarTrabajo oculto" id="modalEliminarTrabajo">
        <div class="modal-eliminar_contenido">
            <i class="fa-solid fa-exclamation-triangle"></i>
            <h4>¿Estás seguro de eliminar este trabajo?</h4>

            <div class="botones-modal-eliminar-trabajo">
                <button type="button" id="btnCancelarEliminarTrabajo">Cancelar</button>
                <button type="submit" id="btnAceptarEliminarTrabajo">Eliminar</button>
            </div>
        </div>
    </div>
    <script src="../JS/sidebar.js"></script>
    <script type="module" src="../JS/trabajos.js"></script>
</body>
</html>

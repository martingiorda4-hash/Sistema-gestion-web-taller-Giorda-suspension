<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <title>Inicio de sesión</title>
</head>
<body>
    <div class="login-container"> 
        <div class="imagenes">
            <img class="img-logo" src="imgs/logo_giorda_transparente_recortado.png" alt="Logo">
        </div>
        <form id="form-login">
            <h3>Acceso administrador</h3>
            <p>Ingrese sus datos para acceder al sistema</p>
            
            <input type="text" id="usuario" placeholder="Ingrese su usuario">
            
            <div class="campo-contraseña">
                <input type="password" id="contraseña" placeholder="Ingrese su contraseña">
                <button type="button" id="btnMostrarContraseña">
                    <i class="fa-solid fa-eye"></i>
                </button>

            </div>
            
    
            <button id="btnIngresar" type="submit">Iniciar sesión</button>
            
        </form>

    </div> 
    <script type="module" src="../JS/login.js"></script>
</body>
</html>

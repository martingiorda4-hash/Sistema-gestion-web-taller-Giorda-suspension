<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/sidebar.css">
    <title>Pagina principal</title>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <img src="imgs/img_logo_giorda.png" alt="Taller Giorda Suspensión">
        </div> 

        <nav class="menu">
            <a href="dashboard.html" class="botones">
                <i class="fa-solid fa-house"></i>
                <span>Inicio</span>
            </a>

            <a href="clientes.html" class="botones">
                <i class="fa-solid fa-users"></i>
                <span>Clientes</span>
            </a>

            <a href="trabajos.html" class="botones">
                <i class="fa-solid fa-wrench"></i>
                <span>Trabajos</span>
            </a>

            <a href="servicios.html" class="botones">
                <i class="fa-solid fa-gear"></i>
                <span>Servicios</span>
            </a>
        </nav>

        <div class="cerrar-sesion">
            <button id="cerrarSesion">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Cerrar sesión</span>
            </button>
        </div>

    </aside>
    <div id="modalCerrarSesion" class="modal-cerrar-sesion oculto">
        <div class="modal-contenido">
            <i class="fa-solid fa-exclamation-triangle"></i>
            <h4>¿Estás seguro de que querés cerrar sesión?</h4>

            <div class="modal-botones">
                <button id="btnCancelarCerrarSesion">Cancelar</button>
                <button id="btnAceptarCerrarSesion">Aceptar</button>
            </div>

        </div>
    </div>
</body>
</html>

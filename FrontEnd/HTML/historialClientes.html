<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/historialClientes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Historial de cliente</title>
</head>
<body>
    <div id="sidebar"></div>
    <main>
        <button class="btn-volver" type="button" id="btnVolver">←Volver</button> 
        <h4 class="nombre-cliente" id="cliente"></h4>

        <div class="contenedor-superior">
            <section class="datos-cliente">
                <h2>Datos del cliente</h2>
                <div class="campo">
                    <span>Tipo de cliente:</span>
                    <strong id="tipoCliente"></strong>
                </div>
                <div class="campo" id="campoNombre">
                    <span>Nombre:</span>
                    <strong id="nombreCliente"></strong>
                </div>
            <div class="campo" id="campoApellido">
                <span>Apellido:</span>
                <strong id="apellidoCliente"></strong>
            </div>
            <div class="campo">
                <span>Teléfono:</span>
                <strong id="telefonoCliente"></strong>
            </div>
            <div class="campo" id="campoCuit">
                <span>CUIT:</span>
                <strong id="cuitCliente"></strong>
            </div>
            <div class="campo" id="campoRazonSocial">
                <span>Razón social:</span>
                <strong id="razonSocialCliente"></strong>
            </div>
        </section>
        
        <section class="vehiculos">
            <div class="seccion-vehiculos">
                <h2>Vehículos</h2>
                <button type="button" id="btnAgregarVehiculo">+ Agregar vehículo</button>
            </div>
            <section class="tabla-vehiculos">
                <table>
                    <thead>
                        <tr>
                            <th>Patente</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Año</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaVehiculos">
                    </tbody>
                </table>

            </section>
        </section>
    </div>
    <section class="historial"> 
        <h2>Trabajos</h2>
        <table>
            <thead>
                <tr>
                    
                    <th>Fecha</th>
                    <th>Vehiculo</th>
                    <th>Trabajo</th>
                    <th>Estado</th>
                    <th>Importe</th>
                </tr>
            </thead>
            <tbody id="historialCliente">
            </tbody>
        </table>
    </section>
</main>
<div class="modal-nuevo-vehiculo oculto" id="modalNuevoVehiculo">
    <div class="modal-contenido">
        <h2>Nuevo vehículo</h2>
        <form id="formNuevoVehiculo">

            <label>Patente</label>
            <input type="text" id="patenteVehiculoNuevo">
            
            <label>Marca</label>
            <input type="text" id="marcaVehiculoNuevo">
            
            <label>Modelo</label>
            <input type="text" id="modeloVehiculoNuevo">
            
            <label>Año</label>
            <input type="number" id="anioVehiculoNuevo">
            
            <div class="botones-modal-nuevo-vehiculo">
                <button type="button" id="btnCancelar">Cancelar</button>
                <button type="submit" id="btnGuardar">Guardar</button>
            </div>
        </form>
    </div>
    
</div>
<div class="modal-eliminar-vehiculo oculto" id="modalEliminarVehiculo">
    <div class="modal-contenido">
        <i class="fa-solid fa-exclamation-triangle"></i>
            <h4>¿Estás seguro de eliminar este vehiculo?</h4>

            <div class="modal-botones">
                <button id="btnCancelarEliminarVehiculo">Cancelar</button>
                <button id="btnAceptarEliminarVehiculo">Eliminar</button>
            </div>
    </div>
</div>
<script src="../JS/sidebar.js"></script>
<script type="module" src="../JS/historialClientes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/clientes.css">
    <title>Clientes</title>
</head>
<body>
    <div id="sidebar"></div>
    <main>
        <div class="titulo">

            <h1>Clientes</h1>
            <button class="btn-nuevo" id="btnNuevoCliente">+ Nuevo cliente</button>
        </div>
        <div class="buscador">
            <input type="text" id="inputBuscarCliente" placeholder="Buscar cliente...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

        <section class="tabla-clientes">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Telefono</th>
                        <th>Total vehículos</th>
                        <th>Estado</th>
                    </tr>
                </thead>

                <tbody id="tablaClientes">
                </tbody>
            </table>

            <div class="paginacion">
                <p id="infoPagina"></p>
                <div class="botones-paginacion">
                    <button id="btnAnterior">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    
                    <button class="numero-pagina activo" data-pagina="1">1</button>
                    <button class="numero-pagina" data-pagina="2">2</button>
                    <button class="numero-pagina" data-pagina="3">3</button>
                    
                    <button id="btnSiguiente">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <div class="modal-clientes oculto" id="modalCliente">
        <div class="modal">
            <h2>Nuevo cliente</h2>
            
            <form id="formCliente">
                <input type="hidden" id="clienteId" value="">
                <select id="tipoCliente">
                    <option value="">Seleccione el tipo de cliente</option>
                    <option value="particular">Particular</option>
                    <option value="empresa">Empresa</option>
                </select>

                <div id="camposParticular" class="oculto">
                    <label>Nombre</label>
                    <input type="text" id="nombreCliente">

                    <label>Apellido</label>
                    <input type="text" id="apellidoCliente">

                    <label>Telefono</label>
                <input type="tel" placeholder="Ej: 3564-123467" id="telefonoParticular">
                </div>
                
                <div id="camposEmpresa" class="oculto">
                    <label>Razón social</label>
                    <input type="text" id="razonSocialCliente">
                    
                    <label>CUIT</label>
                    <input type="text" maxlength="13" placeholder="Ej: 20-12345678-3" pattern="[0-9]{2}-[0-9]{8}-[0-9]" id="cuitCliente">

                    <label>Telefono</label>
                <input type="tel" placeholder="Ej: 3564-1234567" id="telefonoEmpresa">
                </div>
                

                <div class="modal-botones">
                    <button type="button" id="btnCancelarCliente">Cancelar</button>
                    <button type="submit" id="btnGuardarCliente">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <div id="modalEliminarCliente" class="modal-eliminar-cliente oculto">
        <div class="modal-contenido">
            <i class="fa-solid fa-exclamation-triangle"></i>
            <h4>¿Estás seguro que desea dar de baja este cliente?</h4>

            <div class="modal-botones">
                <button id="btnCancelarEliminar">Cancelar</button>
                <button id="btnAceptarEliminar">Eliminar</button>
            </div>

        </div>
    </div>
    <script src="../JS/sidebar.js"></script>
    <script type="module" src="../JS/clientes.js"></script>
</body>
</html>
